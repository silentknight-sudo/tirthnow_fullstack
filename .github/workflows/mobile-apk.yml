name: Mobile APK

# Builds an installable Android APK and attaches it to the run as a download.
# The APK is signed with the debug key (fine for sideloading and testing, not
# for Google Play) and uses the mock sign-in (OTP 123456) and test checkout.
# The universal APK is also published to the `app-latest` GitHub release as
# `tirthnow.apk`, which the website's "Download the app" buttons link to.
on:
  push:
    paths: ['apps/mobile/**', '.github/workflows/mobile-apk.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API origin the app talks to (without /v1)
        required: false

permissions:
  contents: write # publish the APK to the app-latest release

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.MOBILE_API_BASE_URL || 'https://tirthnow-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL="$API_BASE_URL"
      - run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: tirth-now-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      - name: Publish to the app-latest release (website download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk tirthnow.apk
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest \
            --title "TirthNow app (latest build)" --latest \
            --notes "Latest Android build of the TirthNow app. Test build: debug-signed, demo sign-in (OTP 123456)."
          gh release upload app-latest tirthnow.apk --clobber
