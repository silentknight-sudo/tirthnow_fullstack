name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://tirthnow:tirthnow@localhost:5432/tirthnow?schema=public
  DATABASE_URL_TEST: postgresql://tirthnow:tirthnow@localhost:5432/tirthnow_test?schema=public
  SHADOW_DATABASE_URL: postgresql://tirthnow:tirthnow@localhost:5432/tirthnow_shadow?schema=public
  REDIS_URL: redis://localhost:6379
  REDIS_URL_TEST: redis://localhost:6379/15
  JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else-0123
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tirthnow
          POSTGRES_PASSWORD: tirthnow
          POSTGRES_DB: tirthnow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tirthnow" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create test databases
        run: infra/ci/scripts/create-databases.sh

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrations match schema.prisma
        run: pnpm --filter @tirth-now/api db:check

      - name: E2E tests (API)
        run: pnpm test:e2e

      - name: Seed runs cleanly
        run: |
          pnpm --filter @tirth-now/api db:deploy
          pnpm db:seed

      - name: Build
        run: pnpm build
