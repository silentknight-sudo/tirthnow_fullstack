name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://tirthnow:tirthnow@localhost:5432/tirthnow?schema=public
  DATABASE_URL_TEST: postgresql://tirthnow:tirthnow@localhost:5432/tirthnow_test?schema=public
  SHADOW_DATABASE_URL: postgresql://tirthnow:tirthnow@localhost:5432/tirthnow_shadow?schema=public
  REDIS_URL: redis://localhost:6379
  REDIS_URL_TEST: redis://localhost:6379/15
  JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else-0123
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tirthnow
          POSTGRES_PASSWORD: tirthnow
          POSTGRES_DB: tirthnow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tirthnow" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create test databases
        run: infra/ci/scripts/create-databases.sh

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrations match schema.prisma
        run: pnpm --filter @tirth-now/api db:check

      - name: E2E tests (API)
        run: pnpm test:e2e

      - name: Seed runs cleanly
        run: |
          pnpm --filter @tirth-now/api db:deploy
          pnpm db:seed

      - name: Build
        run: pnpm build

      - name: OpenAPI snapshot is current (input for the mobile models)
        run: |
          cp .env.example .env
          node apps/api/dist/openapi-export.js --check

      - name: Portal API client is current
        run: pnpm --filter @tirth-now/api-client check

  mobile:
    name: mobile · analyze · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is current (API models, l10n)
        run: |
          node tool/gen_api_models.mjs
          flutter gen-l10n
          dart format lib/core/api/api_models.dart lib/l10n
          git diff --exit-code -- lib/core/api/api_models.dart lib/l10n
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  mobile-contract:
    name: mobile · contract tests against the API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tirthnow
          POSTGRES_PASSWORD: tirthnow
          POSTGRES_DB: tirthnow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tirthnow" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: development
      STORAGE_PROVIDER: mock
      EMAIL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Migrate, seed and start the API (all providers mocked)
        run: |
          pnpm --filter @tirth-now/api db:deploy
          pnpm db:seed
          pnpm --filter @tirth-now/api build
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:4000/healthz && break; sleep 1; done
      - name: Contract tests
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter test test/contract --dart-define=API_CONTRACT_URL=http://localhost:4000
      - name: API log
        if: failure()
        run: tail -200 /tmp/api.log

  vendor-portal:
    name: vendor portal · browser tests against the API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tirthnow
          POSTGRES_PASSWORD: tirthnow
          POSTGRES_DB: tirthnow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tirthnow" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: development
      STORAGE_PROVIDER: mock
      EMAIL_PROVIDER: mock
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Migrate, seed and start the API (all providers mocked)
        run: |
          pnpm --filter @tirth-now/api db:deploy
          pnpm db:seed
          pnpm --filter @tirth-now/api build
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:4000/healthz && break; sleep 1; done
      - name: Build and serve the portal
        working-directory: apps/vendor-portal
        run: |
          pnpm build
          (python3 -m http.server 3001 -d out > /tmp/portal.log 2>&1 &)
      - run: pnpm --filter @tirth-now/vendor-portal exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @tirth-now/vendor-portal e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vendor-portal-traces
          path: apps/vendor-portal/test-results
          retention-days: 7
      - name: API log
        if: failure()
        run: tail -200 /tmp/api.log

  mobile-android:
    name: mobile · Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
