name: Partner APK

# Builds the installable TirthNow Partner (vendor) APK and attaches it to the run.
# Signed with the debug key (fine for sideloading and testing, not for Google Play),
# demo sign-in (OTP 123456). The APK is also published to the `partner-latest`
# GitHub release as `tirthnow-partner.apk`, a stable download link for partners:
# https://github.com/<owner>/<repo>/releases/download/partner-latest/tirthnow-partner.apk
on:
  push:
    paths: ['apps/vendor_app/**', '.github/workflows/vendor-apk.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API origin the app talks to (without /v1)
        required: false

permissions:
  contents: write # publish the APK to the partner-latest release

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/vendor_app
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.MOBILE_API_BASE_URL || 'https://tirthnow-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: tirthnow-partner-apk
          path: apps/vendor_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      - name: Publish to the partner-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk tirthnow-partner.apk
          gh release view partner-latest >/dev/null 2>&1 || gh release create partner-latest \
            --title "TirthNow Partner app (latest build)" --prerelease \
            --notes "Latest Android build of the TirthNow Partner app for vendors. Test build: debug-signed, demo sign-in (OTP 123456)."
          gh release upload partner-latest tirthnow-partner.apk --clobber
