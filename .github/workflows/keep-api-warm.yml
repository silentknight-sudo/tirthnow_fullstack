name: Keep API warm

# Render's free plan puts the API to sleep after 15 idle minutes, and waking it
# takes 1-3 minutes, so the first screen in the app feels broken. This pings
# /healthz every 10 minutes. Remove it once the API runs on a paid plan.
# Free web services get 750 hours a month, enough for one always-on service.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://tirthnow-api.onrender.com' }}
    steps:
      - name: Ping /healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 150 "$API_URL/healthz") && [ "$code" = 200 ] && { echo "API is up"; exit 0; }
            echo "attempt $i: $code"; sleep 20
          done
          echo "API did not answer"; exit 1
