name: tirth_now
description: "Tirth Now — pilgrim companion app for Braj."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  dio: ^5.11.1
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.1.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  razorpay_flutter: ^1.4.7
  record: ^7.1.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: TiroDevanagari
      fonts:
        - asset: assets/fonts/TiroDevanagariHindi-Regular.ttf
